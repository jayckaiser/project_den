variables:
  PATH_TO_DATA: "./data/FINAL_SampleData.csv"

  FREQ_VISIT_COUNT: 5
  STAFF_ESCORT_COUNT: 5
  SHOW_TOP: 5
  LONG_VISIT_LENGTH_MIN: 20


# Ignore the variables defined in here.
# They make defining plots cleaner.
plot_helpers:
  COLOR_PALETTE: &COLOR_PALETTE  # Fall
    - rgb(61, 89, 65)
    - rgb(119, 136, 104)
    - rgb(181, 185, 145)
    - rgb(246, 237, 189)
    - rgb(237, 187, 138)
    - rgb(222, 138, 90)
    - rgb(202, 86, 44)

  BAR_PLOT_LAYOUT: &BAR_PLOT_LAYOUT
    yaxis: {tickformat: d}
    showlegend: False
    xaxis_title: ~
    yaxis_title: ~

  BAR_PLOT_TRACES: &BAR_PLOT_TRACES
    textfont_size: 16

  PIE_CHART_LAYOUT: &PIE_CHART_LAYOUT
    showlegend: False

  PIE_CHART_TRACES: &PIE_CHART_TRACES
    hoverinfo: label+percent
    textinfo: label+percent+value
    textfont_size: 16

  ZOR_COLOR_MAPPING: &ZOR_COLOR_MAPPING 
    red: darkred
    green: forestgreen
    blue: royalblue
    yellow: palegoldenrod
    ~: black


datasets:

  raw_visit_data: |
    select * from read_csv(
      '{{ PATH_TO_DATA }}',
      union_by_name=True,
      nullstr='N/A',
      filename=True,
      auto_detect=True
    )

  visit_data: |
    select
        -- Datetime columns
        try_strptime("Date of Visit"::text, ['%Y-%m-%d', '%Y-%m-%d %H:%M:%S'])::date as visit_date,

        CASE WHEN MONTH(visit_date) >= 9
            THEN YEAR(visit_date) + 1
            ELSE YEAR(visit_date)
        END::text AS school_year,

        try_strptime(concat("visit_date", ' ', "Time in"), ['%Y-%m-%d %H:%M:%S %p', '%Y-%m-%d %H:%M:%S', '%Y-%m-%d %H:%M']) as raw_time_in,
        try_strptime(concat("visit_date", ' ', "Time out"), ['%Y-%m-%d %H:%M:%S %p', '%Y-%m-%d %H:%M:%S', '%Y-%m-%d %H:%M']) as raw_time_out,

        -- This section fixes input-mistake where AM and PM is chosen incorrectly.
        CASE
            WHEN HOUR("raw_time_in") < 7
                THEN "raw_time_in" + INTERVAL 12 HOURS
            WHEN HOUR("raw_time_in") > 16
                THEN "raw_time_in" - INTERVAL 12 HOURS
            ELSE "raw_time_in"
        END AS time_in,
            
        CASE
            WHEN HOUR("raw_time_out") < 7
                THEN "raw_time_out" + INTERVAL 12 HOURS
            WHEN HOUR("raw_time_out") > 16
                THEN "raw_time_out" - INTERVAL 12 HOURS
            ELSE "raw_time_out"
        END AS time_out,

        -- Demographics columns
        "First Name" as first_name_original,
        "Last Name" as last_name_original,

        lower(regexp_replace( "First Name" , '[^a-zA-Z]', '', 'g')) as first_name,
        lower(regexp_replace(replace("Last Name", '-', ' '), '[^a-zA-Z]', '', 'g')) as last_name,
        concat(first_name, ' ', last_name) as full_name,
        "Grade Level"::text as grade_level,

        -- Setting "unique" IDs
        array_to_string(flatten([

            -- First Name: Joe -> [J]
            [substring(upper("first_name"), 1, 1)],  --Cut N Uppercase initials into a list

            -- Last Name: Martinez-Hernandex -> [M, H]
            list_transform(
                regexp_split_to_array(upper("last_name"), '[- ]'),  --Split Uppercase by either hyphen or space
                x -> substring(x, 1, 1)  --Take the first N initials of each name
            )
        ]), '') as initials,          -- Joe Martinez-Hernandez -> JMH
        

        array_to_string(flatten([

            -- First Name: Joe -> [J]
            [substring(upper("first_name"), 1, 2)],  --Cut N Uppercase initials into a list

            -- Last Name: Martinez-Hernandex -> [M, H]
            list_transform(
                regexp_split_to_array(upper("last_name"), '[- ]'),  --Split Uppercase by either hyphen or space
                x -> substring(x, 1, 2)  --Take the first N initials of each name
            )
        ]), '') as program_id_xyear,  -- Joe Martinez-Hernandez -> JOMAHE

        concat(program_id_xyear, grade_level) as program_id,        -- JOMAHE -> JOMAHE4

        -- Metadata columns
        date_diff('second', time_in, time_out) as visit_length_sec,

        case
            when "*Zones of Regulation Check* Entry" = '' then null
            else lower("*Zones of Regulation Check* Entry")
        end as zor_entry,
    
        case
            when "*Zones of Regulation Check* Exit" = '' then null
            else lower("*Zones of Regulation Check* Exit")
        end as zor_exit,

        "Escorting Staff" as staff_name,

        -- External metadata (optional)
        -- strptime("Timestamp", '%m/%d/%Y %H:%M:%S') as _updated_at,  -- Different format
        filename as _filepath,

    from raw_visit_data

  # TODO: Inject filters on time and grade level
  poster_data: |
    select * from visit_data




layout: |

  AAF
  BBF
  CCG
  CCG
  DEH
  DEH
  DEI
  DEJ



  F:
    name: Count by Hour
    type: bar
    figures:
      - title: Visits by Hour
        x: time
        y: count
        text: count
        color: time
        color_discrete_sequence: *COLOR_PALETTE
    layout: *BAR_PLOT_LAYOUT
    traces: *BAR_PLOT_TRACES
    sql: |
      select
        hour(time_in) as hour,
        strftime(time_in, '%I %p') as time,
        count(*) as count
      from poster_data
      group by all
      order by 1

  G:
    name: Count by Day-of-Week
    type: bar
    figures:
      - title: Visits by Weekday
        x: day
        y: count
        text: count
        color: day
        color_discrete_sequence: *COLOR_PALETTE
    layout: *BAR_PLOT_LAYOUT
    traces: *BAR_PLOT_TRACES
    sql: |
      select
        dayofweek(visit_date) as dow,
        dayname(visit_date) as day,
        count(*) as count
      from poster_data
      where day not in ('Saturday', 'Sunday')
      group by all
      order by 1

  H:
    name: (Distinct) Count by Grade Level
    type: bar
    figures:
      - title: Visits by Grade Level
        x: grade_label
        y: count
        text: count
        color: grade_label
        color_discrete_sequence: *COLOR_PALETTE
      - x: grade_label
        y: num_students
        text: num_students
        color: grade_label
        color_discrete_sequence: *COLOR_PALETTE
    layout:
      barmode: overlay  # Default behavior is side-by-side
      <<: *BAR_PLOT_LAYOUT
    traces: *BAR_PLOT_TRACES
    sql: |
      select
        grade_level,
        case grade_level
          when 'null' then 'n/a'
          when '1' then '1st'
          when '2' then '2nd'
          when '3' then '3rd'
          when '4' then '4th'
          when '5' then '5th'
          when '6' then '6th'
          else grade_level
        end as grade_label,

        case grade_level
          when 'PK' then -2
          when 'K' then -1
          else grade_level::integer
        end as grade_level_order,
        
        count(*) as count,
        count(distinct(full_name, initials)) as num_students
      
      from poster_data
      group by all
      order by grade_level_order

  I:
    name: Count by Entry Zone-of-Regulation
    type: pie
    figures:
      - title: Zones of Reg. at Entry
        names: zor_entry
        values: count
        color: zor_entry
        color_discrete_map: *ZOR_COLOR_MAPPING
        hole: 0.5
    layout: *PIE_CHART_LAYOUT
    traces: *PIE_CHART_TRACES
    sql: |
      select
        zor_entry,
        count(*) as count
      from poster_data
      where zor_entry is not null
      group by all
      order by 1

  J:
    name: Count by Exit Zone-of-Regulation
    type: pie
    figures:
